    var map = { en: 'en/', ja: 'ja/', zh: 'zh/', fr: 'fr/', ko: '' }, lang = '';
    try { lang = localStorage.getItem('haenggungGuideLang') || ''; } catch (e) {}
    if (!(lang in map)) {
      var nav = navigator.language || '';
      lang = /^zh\b.*(TW|HK|MO|Hant)/i.test(nav) ? 'zh-tw' : nav.slice(0, 2);
      map['zh-tw'] = 'zh-tw/';
    }
    location.replace('https://stayeego.com/' + (map[lang] || (lang === 'zh-tw' ? 'zh-tw/' : '')) + 'picks.html' + location.hash);
  })();
</script>
